version: 0.0

os: linux

files:
  - source: /
    destination: /var/www/html

file_exits_behavior: OVERWRITE

permissions:
  - object: /var/www/html
    pattern: "**"

    owner: apache
    group: apache

    mode: 644

    type:
      - file

  - object: /var/www/html
    pattern: "**"
    owner: apache
    group: apache

    mode: 755
    type:
      - directory

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 60
      runas: root

  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: root
